<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic wooden case window</title>
  </head>
  <body>
    <div role="dialog">
      <div>OPEN</div>
      <div>A random resource stack</div>
      <div>3% Epic</div>
      <div>12% Rare</div>

      <div class="reel">
        <img alt="oil" /><img alt="darkEraAmmo" /><img alt="iron" />
      </div>
      <div>Quick animation</div>
      <div>320 Total cases opened</div>
      <div class="drops">
        <div><img alt="cookedFish" /><span>14</span></div>
        <div><img alt="darkEraHeavyAmmo" /><span>14</span></div>
        <div><img alt="cocain" /><span>14</span></div>
        <div><img alt="darkEraAmmo" /><span>14</span></div>
        <div><img alt="steak" /><span>14</span></div>
        <div><img alt="concrete" /><span>14</span></div>
        <div><img alt="steel" /><span>14</span></div>
        <div><img alt="bread" /><span>14</span></div>
        <div><img alt="oil" /><span>1.04K</span></div>
        <div><img alt="paper" /><span>14</span></div>
        <div><img alt="darkEraLightAmmo" /><span>14</span></div>
        <div><img alt="grain" /><span>14</span></div>
        <div><img alt="iron" /><span>14</span></div>
        <div><img alt="wood" /><span>14</span></div>
        <div><img alt="lead" /><span>14</span></div>
        <div><img alt="limestone" /><span>14</span></div>
        <div><img alt="coca" /><span>14</span></div>
        <div><img alt="petroleum" /><span>14</span></div>
        <div><img alt="livestock" /><span>14</span></div>
        <div><img alt="fish" /><span>14</span></div>
      </div>
      <div class="actions"><button>OPEN</button><button>CLOSE</button></div>
    </div>
  </body>
</html>
