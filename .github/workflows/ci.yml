name: Extension checks
on:
  pull_request:
  push:
    branches: [main, feat/warera-lens]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      # the Chrome Web Store package, downloadable from the run
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: warera-plus-store-package
          path: dist/*.zip
          if-no-files-found: error
